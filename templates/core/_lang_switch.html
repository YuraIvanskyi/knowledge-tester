{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<form class="lang-switch lang-switch-{{ where }}" method="post" action="{% url 'set_language' %}" aria-label="{% trans 'Language' %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% get_available_languages as available %}{% get_language_info_list for available as languages %}
  {% for lang in languages %}<button type="submit" name="language" value="{{ lang.code }}" lang="{{ lang.code }}" title="{{ lang.name_local|capfirst }}" aria-label="{{ lang.name_local|capfirst }}"{% if lang.code == LANGUAGE_CODE %} aria-current="true"{% endif %}>{% if lang.code == "uk" %}UA{% elif lang.code == "en" %}ENG{% else %}{{ lang.code|upper }}{% endif %}</button>{% endfor %}
</form>
