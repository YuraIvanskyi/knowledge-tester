[project]
name = "knowledge-tester"
version = "0.1.0"
description = "Local, offline-first classroom testing: build tests, share them over the LAN, autograde, print PDF sheets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "waitress",
    "whitenoise",
    "ifaddr",
    "segno",
    "pydantic>=2",
    "fpdf2>=2.9.0",
]

[project.optional-dependencies]
# Installed with `uv sync --extra <name>` when the feature is used (plan §6.2).
xlsx = ["openpyxl>=3.1"]   # roster import (phase 6) and results export
docs = []        # phase 7: python-docx, pypdf
mdns = []        # phase 9: zeroconf
translate = []   # phase 8: django-rosetta

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "polib>=1.2.0",
    "pypdf>=7.0.1",
]

[tool.uv]
# This is an application, not a distributable package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q"
filterwarnings = [
    # WhiteNoise warns that collectstatic has not run; tests do not serve static files.
    "ignore:No directory at:UserWarning",
]
